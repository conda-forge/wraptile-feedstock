{% set name = "wraptile" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wraptile-{{ version }}.tar.gz
  sha256: 45fcf2a8dfcb5afbf36f8641f245cf91d6526b3d86503e1e95295ed9b0184e22

build:
  entry_points:
    - wraptile = wraptile.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - fastapi
    - pydantic
    - pyyaml
    - typer >=0.26.0,<1
    - uvicorn
    - gavicore >=0.3.0
    - procodile >=0.3.0

test:
  imports:
    - wraptile
  commands:
    - pip check
    - wraptile --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/eo-tools/eozilla/tree/main/wraptile
  doc_url: https://eo-tools.github.io/eozilla/
  dev_url: https://github.com/eo-tools/eozilla/
  summary: A fast and light-weight server that implements the OGC API - Processes, Part 1.
  description: |
    Eozilla 🦖 Wraptile is a fast and light-weight server that implements the
    [OGC API - Processes, Part 1](https://github.com/opengeospatial/ogcapi-processes)
    for a given workflow orchestration system like Airflow.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - freds-dev
    - AliceBalfanz
    - b-yogesh
    - clarasb
    - forman
    - konstntokas
    - pont-us
    - TejasMorbagal
    - thomasstorm
    - TonioF
